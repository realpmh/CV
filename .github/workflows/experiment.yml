name: Chinese Painting CV Experiment
on:
  push:
    paths:
      - '.github/workflows/experiment.yml'
      - 'run_experiment.py'
      - 'input/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install models and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' 'torchvision==0.21.0' 'rembg[cpu]==2.0.67' 'scikit-image==0.25.2'
      - name: Run four pretrained models
        env:
          OMP_NUM_THREADS: '2'
          NUMBA_NUM_THREADS: '2'
        run: python run_experiment.py
      - name: Publish numeric predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/results.json
          git commit -m "Publish computed four-model inference results" || true
          git push
      - name: Collect original inputs and inference outputs
        uses: actions/upload-artifact@v4
        with:
          name: experiment-five-results
          path: results/
          retention-days: 30
